```yaml
name: Terraform Azure Deployment plan

on:
  push:
    branches:
      - feature/testbranch
  workflow_dispatch:

jobs:
  terraform:
    runs-on: self-hosted

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Current Directory
        shell: powershell
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "`nFiles:"
          Get-ChildItem -Force

          Write-Host "`nmain.tf:"
          Get-Item .\main.tf

      - name: Check Terraform
        shell: powershell
        run: |
          where.exe terraform
          terraform version

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Account
        shell: powershell
        run: |
          az account show

      - name: Terraform Init
        shell: powershell
        run: |
          terraform init

      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate

      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan -out=tfplan -no-color
```
